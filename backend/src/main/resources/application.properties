spring.application.name=yatrarail-backend

# Default profile for local development. Override with --spring.profiles.active=prod for deployment.
spring.profiles.default=dev

# ---- JPA / Hibernate (common) ----
# Explicit transaction boundaries: lazy loading is only allowed inside @Transactional services.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Demo data is seeded in code (see config/DemoDataSeeder.java), only when tables are empty,
# so it is safe to leave this on every startup.
yatrarail.seed-demo-data=${SEED_DEMO_DATA:true}

# ---- Reservation engine (Phase 2) ----
# How long a seat stays HELD for a PAYMENT_PENDING booking before the expiry job releases it.
yatrarail.booking.hold-minutes=${BOOKING_HOLD_MINUTES:10}
yatrarail.booking.max-passengers-per-booking=${BOOKING_MAX_PASSENGERS:6}
# Cron for the job that releases expired seat holds (default: every minute).
yatrarail.booking.expiry-cron=${BOOKING_EXPIRY_CRON:0 * * * * *}
yatrarail.booking.expiry-job-enabled=${BOOKING_EXPIRY_JOB_ENABLED:true}

# ---- Temporary guest sessions (Phase 3) ----
# How long a "continue as guest" session may act before the backend refuses it, even if the
# token itself has not expired. Enforced per request, not just by the JWT clock.
yatrarail.temporary-session.ttl-minutes=${TEMP_SESSION_TTL_MINUTES:120}
# Hard ceiling a client can never talk the server into exceeding.
yatrarail.temporary-session.max-ttl-minutes=${TEMP_SESSION_MAX_TTL_MINUTES:180}
# Opening a session is anonymous and inserts a row, so it is throttled per IP.
yatrarail.temporary-session.max-sessions-per-ip=${TEMP_SESSION_MAX_PER_IP:5}
yatrarail.temporary-session.rate-window-minutes=${TEMP_SESSION_RATE_WINDOW_MINUTES:60}
# Housekeeping: deactivate stale sessions, and purge expired booking-less ones after N days.
yatrarail.temporary-session.cleanup-cron=${TEMP_SESSION_CLEANUP_CRON:0 */15 * * * *}
yatrarail.temporary-session.cleanup-job-enabled=${TEMP_SESSION_CLEANUP_JOB_ENABLED:true}
yatrarail.temporary-session.retention-days=${TEMP_SESSION_RETENTION_DAYS:7}

# ---- Refund policy (Phase 5) ----
# Ordered most-generous first; the first tier whose min-days-before-journey is met applies. These
# defaults reproduce the Phase 2-4 behaviour exactly, so turning on Phase 5 does not change what an
# existing cancellation is worth. A passenger is shown this same table in the refund preview.
yatrarail.refund.tiers[0].min-days-before-journey=7
yatrarail.refund.tiers[0].refund-percent=90
yatrarail.refund.tiers[0].label=At least 7 days before departure
yatrarail.refund.tiers[1].min-days-before-journey=2
yatrarail.refund.tiers[1].refund-percent=50
yatrarail.refund.tiers[1].label=2 to 6 days before departure
yatrarail.refund.tiers[2].min-days-before-journey=0
yatrarail.refund.tiers[2].refund-percent=25
yatrarail.refund.tiers[2].label=Same day or 1 day before departure
# The flat platform fee is a booking-level charge, not fare, so a FULL cancellation returns it in
# full regardless of tier. A partial cancellation never returns it: the booking still stands.
yatrarail.refund.return-platform-fee-on-full-cancellation=${REFUND_RETURN_PLATFORM_FEE:true}

# ---- Printable ticket + QR (Phase 5) ----
# The secret that signs the QR payload. It must never be a published default in production, so the
# production profile requires it from the environment; the dev and test profiles supply their own.
yatrarail.ticket.signing-secret=${TICKET_SIGNING_SECRET:}
yatrarail.ticket.issuer=${TICKET_ISSUER:yatrarail}
yatrarail.ticket.payload-version=${TICKET_PAYLOAD_VERSION:1}
yatrarail.ticket.payload-prefix=${TICKET_PAYLOAD_PREFIX:YATRARAIL-TICKET}
yatrarail.ticket.valid-days=${TICKET_VALID_DAYS:365}

# ---- Server ----
server.port=${SERVER_PORT:8080}
# Behind a proxy or a load balancer the container must trust the X-Forwarded-* headers, otherwise
# every client is seen as one address and per-IP throttling (login, guest sessions) collapses.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# ---- Logging ----
# Every log line carries the request id assigned by RequestIdFilter, so one request can be followed
# across threads and services. `%X{requestId:-}` renders a dash when there is no request in flight
# (for example a scheduled job), instead of printing the literal placeholder.
logging.pattern.console=${LOG_PATTERN:%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n}
logging.level.com.yatrarail=INFO
logging.level.org.springframework.security=WARN

# ---- Phase 10: caching (read-mostly master data) ----
# The cache is size-bounded and time-bounded so it can never grow without limit and can never hold
# a value indefinitely. It is only ever applied to master data -- never to live seat inventory,
# which changes with every booking and is answered from the database.
yatrarail.cache.enabled=${CACHE_ENABLED:true}
yatrarail.cache.ttl-seconds=${CACHE_TTL_SECONDS:300}
yatrarail.cache.max-size=${CACHE_MAX_SIZE:10000}

# ---- Phase 10: async / queue readiness ----
# A bounded executor is the seam a real message broker would plug into. It has a hard queue cap and
# a caller-runs back-pressure policy, so an overload rejects work visibly instead of exhausting the
# heap. Async listeners are opt-in; the default keeps the request thread.
yatrarail.platform.async-enabled=${PLATFORM_ASYNC_ENABLED:false}
yatrarail.platform.async-core-pool-size=${PLATFORM_ASYNC_CORE_POOL_SIZE:4}
yatrarail.platform.async-max-pool-size=${PLATFORM_ASYNC_MAX_POOL_SIZE:16}
yatrarail.platform.async-queue-capacity=${PLATFORM_ASYNC_QUEUE_CAPACITY:500}
# How long a request may be traced before the filter stops grouping it, in milliseconds.
yatrarail.platform.slow-request-ms=${PLATFORM_SLOW_REQUEST_MS:1000}

# ---- Actuator (health, info, metrics) ----
# Health is public (a load balancer must be able to poll it without a token); every other endpoint
# is ADMIN-only. Details are shown only to an authenticated caller, so component names and database
# diagnostics are not disclosed on the public health check.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.endpoint.health.show-components=${HEALTH_SHOW_COMPONENTS:when-authorized}
management.endpoint.health.probes.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true
management.info.build.enabled=true
info.app.name=YatraRail
info.app.description=Indian Railway inspired ticket booking and management platform (academic project)
info.app.version=@project.version@