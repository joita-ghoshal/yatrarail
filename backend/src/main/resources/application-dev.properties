# =====================================================================
# LOCAL DEVELOPMENT PROFILE
# The defaults below are ONLY for a developer's own machine. They are not
# production values and must never be used beyond local testing.
# Override any value with its environment variable for a custom local setup.
# =====================================================================

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yatrarail}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# ---- JWT (dev only defaults) ----
yatrarail.security.jwt.secret=${JWT_SECRET:yatrarail-dev-only-secret-change-me-please-32chars-min}
yatrarail.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
yatrarail.security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Temporary guest sessions (Phase 3) ----
# Generous locally so manual testing is not throttled; production tightens these.
yatrarail.temporary-session.ttl-minutes=${TEMP_SESSION_TTL_MINUTES:120}
yatrarail.temporary-session.max-sessions-per-ip=${TEMP_SESSION_MAX_PER_IP:20}

# ---- Printable ticket + QR (Phase 5) ----
# Local-only signing secret, same posture as the dev JWT secret: long enough to satisfy binding
# validation, never reused in production. Tickets signed here will not verify in production.
yatrarail.ticket.signing-secret=${TICKET_SIGNING_SECRET:yatrarail-dev-only-ticket-signing-secret-32chars}

# ---- Phase 10: caching / async ----
# A short TTL locally so an edit is visible quickly while developing; a bigger cache in production.
yatrarail.cache.ttl-seconds=${CACHE_TTL_SECONDS:60}
yatrarail.cache.max-size=${CACHE_MAX_SIZE:1000}
# Async stays off by default so a stack trace points at the real request thread while developing.
yatrarail.platform.async-enabled=${PLATFORM_ASYNC_ENABLED:false}
