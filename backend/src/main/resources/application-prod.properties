# =====================================================================
# PRODUCTION PROFILE
# Every sensitive value MUST be supplied via environment variables.
# If any of the ${VAR} placeholders below is missing, the application
# FAILS FAST at startup instead of booting with insecure defaults.
# =====================================================================

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate (not update) the schema in production; migrations must be managed explicitly.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# ---- JWT (required; must be a long random secret of at least 32 chars) ----
yatrarail.security.jwt.secret=${JWT_SECRET}
yatrarail.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# ---- CORS (required; comma separated, e.g. https://app.example.com) ----
yatrarail.security.cors.allowed-origins=${CORS_ORIGINS}

# ---- Demo data ----
yatrarail.seed-demo-data=${SEED_DEMO_DATA:false}

# ---- Reservation engine (Phase 2) ----
# A tighter payment window in production means less inventory held by abandoned carts.
yatrarail.booking.hold-minutes=${BOOKING_HOLD_MINUTES:10}
yatrarail.booking.max-passengers-per-booking=${BOOKING_MAX_PASSENGERS:6}
yatrarail.booking.expiry-cron=${BOOKING_EXPIRY_CRON:0 * * * * *}
yatrarail.booking.expiry-job-enabled=${BOOKING_EXPIRY_JOB_ENABLED:true}

# ---- Temporary guest sessions (Phase 3) ----
# Guests are anonymous and write a row per session, so production keeps the TTL short,
# the per-IP cap tight, and the cleanup job definitely on.
yatrarail.temporary-session.ttl-minutes=${TEMP_SESSION_TTL_MINUTES:60}
yatrarail.temporary-session.max-ttl-minutes=${TEMP_SESSION_MAX_TTL_MINUTES:120}
yatrarail.temporary-session.max-sessions-per-ip=${TEMP_SESSION_MAX_PER_IP:3}
yatrarail.temporary-session.rate-window-minutes=${TEMP_SESSION_RATE_WINDOW_MINUTES:60}
yatrarail.temporary-session.cleanup-cron=${TEMP_SESSION_CLEANUP_CRON:0 */15 * * * *}
yatrarail.temporary-session.cleanup-job-enabled=${TEMP_SESSION_CLEANUP_JOB_ENABLED:true}
yatrarail.temporary-session.retention-days=${TEMP_SESSION_RETENTION_DAYS:7}

# ---- Refund policy (Phase 5) ----
# Overridable per deployment, but the defaults are the same values shipped in Phases 2-4, so a
# production upgrade does not change what an already-booked passenger is owed.
yatrarail.refund.return-platform-fee-on-full-cancellation=${REFUND_RETURN_PLATFORM_FEE:true}

# ---- Printable ticket + QR (Phase 5) ----
# REQUIRED from the environment. A missing value fails startup instead of issuing tickets that
# cannot be verified later. Use a different secret from JWT_SECRET, and rotate it out of band.
yatrarail.ticket.signing-secret=${TICKET_SIGNING_SECRET}
yatrarail.ticket.issuer=${TICKET_ISSUER:yatrarail}

# ---- Phase 10: caching / async / observability ----
# Production caches master data for longer, with a larger bound, and dispatches non-critical
# fan-out off the request thread onto a bounded pool.
yatrarail.cache.enabled=true
yatrarail.cache.ttl-seconds=${CACHE_TTL_SECONDS:300}
yatrarail.cache.max-size=${CACHE_MAX_SIZE:10000}
yatrarail.platform.async-enabled=${PLATFORM_ASYNC_ENABLED:true}
yatrarail.platform.async-core-pool-size=${PLATFORM_ASYNC_CORE_POOL_SIZE:4}
yatrarail.platform.async-max-pool-size=${PLATFORM_ASYNC_MAX_POOL_SIZE:16}
yatrarail.platform.async-queue-capacity=${PLATFORM_ASYNC_QUEUE_CAPACITY:500}
# Health details are withheld from anonymous callers in production.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
