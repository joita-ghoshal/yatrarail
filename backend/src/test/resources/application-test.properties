# =====================================================================
# TEST PROFILE
# Uses an in-memory H2 database (PostgreSQL compatibility mode) so the
# full test-suite runs without Docker or a local PostgreSQL instance.
# =====================================================================

# H2 in-memory, PostgreSQL mode
spring.datasource.url=jdbc:h2:mem:yatrarail;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Seed the standard demo data (admin/staff/passenger + trains/stations/fares)
yatrarail.seed-demo-data=true

# JWT secret must be >= 32 chars (test-only value)
yatrarail.security.jwt.secret=test-only-yatrarail-jwt-secret-0123456789abcdef
yatrarail.security.jwt.expiration-ms=3600000

# CORS is irrelevant to MockMvc but the binding still requires a value
yatrarail.security.cors.allowed-origins=http://localhost:5173

spring.jpa.open-in-view=false

# ---- Reservation engine ----
# The expiry job is driven explicitly in tests so timing does not make them flaky.
yatrarail.booking.hold-minutes=10
yatrarail.booking.max-passengers-per-booking=6
yatrarail.booking.expiry-job-enabled=false

# ---- Temporary guest sessions ----
# The cleanup job is driven explicitly in tests, and the per-IP cap is raised so
# lifecycle tests are not throttled by a shared "unknown" client address.
yatrarail.temporary-session.ttl-minutes=120
yatrarail.temporary-session.max-sessions-per-ip=100
yatrarail.temporary-session.cleanup-job-enabled=false

# ---- Phase 5: refund policy + ticket signing ----
# The refund tiers are left at their defaults so the refund arithmetic the suite asserts is the
# one the defaults actually describe (90% / 50% / 25%, platform fee returned on a full cancel).
yatrarail.refund.return-platform-fee-on-full-cancellation=true
# Test-only ticket signing secret (>= 32 chars), distinct from the JWT secret above.
yatrarail.ticket.signing-secret=test-only-yatrarail-ticket-signing-secret-0123456789
yatrarail.ticket.valid-days=365

# ---- Phase 10: caching / async / observability ----
# Caching is enabled so the readiness suite exercises the cache, but the TTL is left at a sane
# default. Async stays off so an assertion never races a background thread.
yatrarail.cache.enabled=true
yatrarail.cache.ttl-seconds=300
yatrarail.cache.max-size=1000
yatrarail.platform.async-enabled=false
# Show health details to the test client (MockMvc) so component assertions can read them.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
