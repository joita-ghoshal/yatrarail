<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YatraRail</title>
    <script>
      // GitHub Pages serves this file for any unknown path (e.g. /yatrarail/search).
      // Remember the real URL, bounce to the app shell, and let index.html restore it
      // so the client-side router lands on the intended page instead of a 404.
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/yatrarail/'" />
  </head>
  <body></body>
</html>
