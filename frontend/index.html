<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restores a deep link captured by 404.html on GitHub Pages (SPA fallback).
      (function () {
        var redirect = sessionStorage.getItem('redirect');
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%train-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YatraRail — Book Train Tickets</title>
    <meta name="description" content="YatraRail — an Indian Railway-inspired ticket booking demo platform. Academic/portfolio project, not affiliated with Indian Railways or IRCTC." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
